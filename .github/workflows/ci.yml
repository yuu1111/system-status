name: CI

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "biome.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "biome.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - run: bun test
      - run: bun run build
      - run: bun run test:node
      - run: npm pack --dry-run
